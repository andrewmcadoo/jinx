# Jinx hardening — see spec §4.2.
PasswordAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
ChallengeResponseAuthentication no
KbdInteractiveAuthentication no

# Encode the single-user invariant (spec §4) directly in sshd. Even if a
# future bug or stray useradd creates a service account with a shell, sshd
# will refuse the login. NOTE: Lightsail browser-based "Connect" defaults
# to the `ubuntu` user — set the username to `andrew` in that dialog when
# using emergency recovery (RUNBOOK §"Emergency: locked out of SSH").
AllowUsers andrew

# Application-layer keepalive probes for SSH sessions on quiet channels.
# When sshd has no data in flight, missed probes let it disconnect a dead
# peer within ~60s. NOTE: does NOT help the GH-Actions-cancel-mid-deploy
# scenario — deploy.sh's heredoc uses non-PTY ssh, so even if sshd
# detects the dead client and exits, it cannot signal the running bash;
# the orphan finishes its current command (e.g., next build) on its own
# clock. See bd:mimir-nd2n close-out for the full mechanism analysis;
# the orphan-resource concern is being addressed via a pre-flight sweep
# in deploy.sh instead (bd:mimir-1z24).
ClientAliveInterval 20
ClientAliveCountMax 3
