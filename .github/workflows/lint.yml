name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to v2.0.0 SHA (not @master) to neutralise supply-chain risk
      # if the upstream branch is ever hijacked. Bump the SHA when reviewing
      # https://github.com/ludeeus/action-shellcheck/releases.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091

  caddy-validate:
    name: caddy validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Caddy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
            | sudo gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
          curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
            | sudo tee /etc/apt/sources.list.d/caddy-stable.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y caddy
      - name: Pre-create paths Caddy validate expects on disk
        # `caddy validate` instantiates writers AND loads TLS material — it's
        # not a pure syntax check. In production these paths are populated by
        # bootstrap.sh + scp from the operator's laptop; in CI we synthesize
        # them so syntax + adapter validation can complete.
        run: |
          sudo install -d -m 0755 /var/log/caddy
          sudo chown "$(id -un):$(id -gn)" /var/log/caddy
          sudo install -d -m 0755 /etc/ssl/jinx
          sudo openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /etc/ssl/jinx/key.pem \
            -out    /etc/ssl/jinx/cert.pem \
            -subj   "/CN=ci-fake.invalid"
          sudo chmod 0644 /etc/ssl/jinx/cert.pem
          sudo chmod 0644 /etc/ssl/jinx/key.pem
      - name: Validate Caddyfile
        run: caddy validate --config caddy/Caddyfile

  systemd-verify:
    name: systemd-analyze verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify systemd units
        # `verify` complains about missing paths — that's fine, we only fail
        # on syntax/directive errors.
        run: |
          for unit in systemd/*.service; do
            echo "=== $unit ==="
            # Filter out warnings about non-existent paths/users/groups,
            # which are expected on a CI host that doesn't have /srv set up.
            output=$(systemd-analyze verify "$unit" 2>&1 || true)
            echo "$output"
            if echo "$output" | grep -qE "(Failed to parse|bad-setting|invalid-)"; then
              exit 1
            fi
          done

  visudo-check:
    name: visudo syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate sudoers/00-andrew (single source of truth)
        # The repo file sudoers/00-andrew is the canonical sudoers grant;
        # bootstrap.sh inlines a heredoc with the same body. Validating the
        # repo file directly means CI fails fast if anyone edits the canonical
        # file with bad syntax — and removes the previous duplication where
        # this job hardcoded "andrew ALL=(ALL) ALL".
        run: sudo visudo -cf sudoers/00-andrew
      - name: Verify bootstrap.sh inline copy matches the repo file
        # Defends against drift between the two copies. Extracts the heredoc
        # body bootstrap.sh writes to /etc/sudoers.d/00-andrew and diffs it
        # against the canonical file (ignoring comment-only lines so the
        # repo file can carry its header).
        run: |
          tmp=$(mktemp)
          # Pull the line bootstrap.sh writes via printf: it's the only
          # `printf '%s ALL=(ALL) ALL\n'` in the file.
          grep -E "^[[:space:]]*printf '%s ALL=" bootstrap.sh \
            | sed -E "s/^[[:space:]]*printf '%s ALL=\(ALL\) ALL.*$/\${LINUX_USER} ALL=(ALL) ALL/" \
            | sed -E 's/\$\{LINUX_USER\}/andrew/' \
            > "$tmp"
          # Strip comments + blank lines from the canonical file for the diff.
          grep -vE '^[[:space:]]*(#|$)' sudoers/00-andrew > "${tmp}.canonical"
          diff -u "${tmp}.canonical" "$tmp"
          rm -f "$tmp" "${tmp}.canonical"
